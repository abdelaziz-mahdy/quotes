## Github Actions CI workflow: every app change pushed to master is a Play
## Store production release.
name: CI_STORE_DEPLOY_ANDROID

on:
  push:
    branches: [master]
    # Only app changes are a release. A push that touches nothing but the
    # backend, docs, tests or CI would re-upload the same version code, which
    # Play rejects, so it doesn't run the deploy.
    paths-ignore:
      - 'server/**'
      - '**/*.md'
      - '*.md'
      - 'test/**'
      - 'tool/**'
      - '.github/**'
      - 'docs/**'
concurrency: 
    group: auto-deploy
    cancel-in-progress: true
      
jobs:
  store_deploy_android:
    # Only run this job if the branch name starts with 'release/'
    # if:  startsWith(github.head_ref, 'release/')
    name: android store release
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 17.0
      FLUTTER_VERSION: stable
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab
      KEYSTORE_PATH: android/upload-keystore.jks
      KEY_PROPS_PATH: android/key.properties
      SERVICE_ACCOUNT_PATH: store_credentials.json
      PACKAGE_NAME: com.zcreations.quotes
    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v3

      # Setup Java in the VM
      - name: Setup Java to compile the Android project
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      
      # Setup Flutter in the VM
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # flutter-version: ${{ env.FLUTTER_VERSION }}

      # Decode Android env variables
      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.KEYSTORE_PATH }}

      - name: Decode Android key properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > ${{ env.KEY_PROPS_PATH }}

      # Decode Android release Service Account
      - name: Decode Android Service Account
        run: echo "${{ secrets.PRODUCTION_CREDENTIAL_FILE }}" | base64 --decode > ${{ env.SERVICE_ACCOUNT_PATH }}

      # Run flutter commands
      - name: Run flutter pub get
        run: flutter pub get

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🕵️ Analyze to check for bad Dart/Flutter practices
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

    #   - name: 📉 Run all app tests
    #     run: flutter test

      # Build Android Bundle release file
      - name: Build aab
        run: |
          flutter build appbundle --release

      # Upload generated aab to project artifacts
      - name: Upload generated aab to the artifacts
        uses: actions/upload-artifact@master
        with:
          name: aab-stores
          path: ${{ env.AAB_PATH }}

      # Play "What's new" = the newest CHANGELOG.md entry (written for users,
      # max 500 chars). The store listing's only language is en-US.
      - name: Release notes from CHANGELOG
        run: python3 tool/play_whatsnew.py CHANGELOG.md distribution/whatsnew en-US

      # Deploy bundle to Google Play. No track is set, so the action's default
      # (production) applies: merging to master is a public release.
      - name: Deploy to Play Store (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.SERVICE_ACCOUNT_PATH }}
          packageName: ${{env.PACKAGE_NAME}}
          releaseFiles: ${{ env.AAB_PATH }}
          whatsNewDirectory: distribution/whatsnew
        #   track: internal